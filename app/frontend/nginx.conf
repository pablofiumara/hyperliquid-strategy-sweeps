server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # API: data changes server-side (summaries, imports) -> never cache.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "no-store" always;
    }

    # Hashed build assets are immutable by name -> cache them forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html references the hashed bundle -> always revalidate so
    # a fresh deploy is picked up (and the build-watcher auto-reloads).
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
