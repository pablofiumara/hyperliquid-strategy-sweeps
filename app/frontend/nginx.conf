# Limits are keyed by client IP, so every user behind one NAT/corporate proxy
# shares a bucket. Size the read limit for that worst case, not for one user.
limit_req_zone $binary_remote_addr zone=reads:10m  rate=50r/s;
limit_req_zone $binary_remote_addr zone=asks:10m   rate=2r/s;

server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # This app has no authentication, so the only thing standing between a
    # runaway script (or an AI agent looping) and an exhausted server is these
    # limits. Reads are cheap and polled; asks are expensive and rate-limited
    # far harder.
    #
    # limit_req_status 429 makes nginx speak the same status code as the
    # application's own backpressure (jobs.py queue_full / capacity), so a
    # client only has to handle one "slow down" signal.
    limit_req_status 429;

    # Server-Sent Events for agent jobs. Two settings are mandatory here:
    #   proxy_buffering off  - otherwise nginx accumulates the response and
    #                          the client sees nothing until the job finishes,
    #                          which defeats the point of streaming.
    #   long read timeout    - an agent can take up to 300s.
    location /api/jobs/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Cache-Control "no-store" always;
        add_header X-Accel-Buffering "no" always;
    }

    # Agent asks: expensive, tight limit.
    location /api/runs/ {
        limit_req zone=asks burst=10 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "no-store" always;
        # nginx's limit_req does not emit Retry-After on its own. Clients only
        # act on this header alongside a 429/503, so sending it on the 2xx
        # responses from this location too is harmless.
        add_header Retry-After "5" always;
    }

    # Everything else read-only: loose limit.
    location /api/ {
        limit_req zone=reads burst=100 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "no-store" always;
    }

    # Hashed build assets are immutable by name -> cache them forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html references the hashed bundle -> always revalidate so
    # a fresh deploy is picked up (and the build-watcher auto-reloads).
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
