server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Server-Sent Events for agent jobs. Two settings are mandatory here:
    #   proxy_buffering off  - otherwise nginx accumulates the response and
    #                          the client sees nothing until the job finishes,
    #                          which defeats the point of streaming.
    #   long read timeout    - an agent can take up to 300s.
    location /api/jobs/ {
        proxy_pass http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        chunked_transfer_encoding off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        add_header Cache-Control "no-store" always;
        add_header X-Accel-Buffering "no" always;
    }

    # API: data changes server-side (summaries, imports) -> never cache.
    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        add_header Cache-Control "no-store" always;
    }

    # Hashed build assets are immutable by name -> cache them forever.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # index.html references the hashed bundle -> always revalidate so
    # a fresh deploy is picked up (and the build-watcher auto-reloads).
    location = /index.html {
        add_header Cache-Control "no-store" always;
    }

    location / {
        try_files $uri /index.html;
    }
}
