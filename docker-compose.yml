services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: hl
      POSTGRES_PASSWORD: hl
      POSTGRES_DB: hl
    command: ["postgres", "-c", "shared_preload_libraries=pg_stat_statements", "-c", "pg_stat_statements.max=1000"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./app/backend/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U hl -d hl"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"

  backend:
    build: ./app/backend
    environment:
      DATABASE_URL: postgresql://hl:hl@db:5432/hl
      DATA_DIR: /data
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
      ASK_JOBS_DIR: /pv_ask_jobs
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/data:rw
      - /home/paf/Documents/code/misc/prompt-viewer/ask_jobs:/pv_ask_jobs:ro
      - /home/paf/.npm-global:/root/.npm-global
      - /home/paf/.kilo:/root/.kilo
      - /home/paf/.opencode:/root/.opencode
      - /home/paf/.cline:/root/.cline
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8002:8000"

  # Dedicated agent worker. It drains the same agent_jobs table the API writes
  # to, using FOR UPDATE SKIP LOCKED. Running it separately from the API means
  # the concurrency cap is GLOBAL: if the API scaled to N uvicorn workers each
  # spawning in-process workers, the effective agent parallelism would be
  # N * AGENT_CONCURRENCY, and each process would hold its own semaphore --
  # a cap that silently multiplies with horizontal scaling.
  agent-worker:
    build: ./app/backend
    command: ["python3", "/srv/worker.py"]
    environment:
      DATABASE_URL: postgresql://hl:hl@db:5432/hl
      DATA_DIR: /data
      ASK_JOBS_DIR: /pv_ask_jobs
      # vector_index.py embeds the report being asked about (keyword fallback
      # if this host is unreachable).
      OLLAMA_BASE_URL: http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - .:/data:rw
      - /home/paf/Documents/code/misc/prompt-viewer/ask_jobs:/pv_ask_jobs:ro
      - /home/paf/.npm-global:/root/.npm-global
      - /home/paf/.kilo:/root/.kilo
      - /home/paf/.opencode:/root/.opencode
      - /home/paf/.cline:/root/.cline
    depends_on:
      db:
        condition: service_healthy
    deploy:
      replicas: 1
    restart: unless-stopped

  frontend:
    build: ./app/frontend
    depends_on:
      - backend
    ports:
      - "8080:80"

volumes:
  pgdata:
